name: Build & Release Tally Audit Assistant

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      manual_version:
        description: 'Manual version override (e.g., 1.0.17). Leave empty to auto-calculate.'
        required: false
        default: ''

concurrency:
  group: tally-audit-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-windows:
    name: Build, Test & Package Windows Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Display .NET SDK Environment
        run: dotnet --info

      - name: Calculate Automatic Application Version
        id: versioning
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $repo = $env:GITHUB_REPOSITORY
          $headers = @{
            "Authorization" = "Bearer $env:GITHUB_TOKEN"
            "Accept" = "application/vnd.github.v3+json"
            "User-Agent" = "TallyAuditAssistant-CI"
          }
          $url = "https://api.github.com/repos/$repo/releases?per_page=100"
          
          # Fetch releases with retry in case of transient API error
          $releases = $null
          for ($i=1; $i -le 3; $i++) {
            try {
              $releases = Invoke-RestMethod -Uri $url -Headers $headers -ErrorAction Stop
              break
            } catch {
              Write-Host "Warning: Attempt $i to fetch releases failed: $_"
              Start-Sleep -Seconds 2
            }
          }
          
          $validVersions = @()
          if ($releases) {
            foreach ($r in $releases) {
              $tag = $r.tag_name
              if ($tag -match '^v(\d+)\.(\d+)\.(\d+)$') {
                $verObj = [version]"$($matches[1]).$($matches[2]).$($matches[3])"
                $validVersions += $verObj
              }
            }
          }
          
          $ver = ""
          $manualVer = "${{ github.event.inputs.manual_version }}".Trim()
          
          if ($env:GITHUB_REF -match '^refs/tags/v(\d+\.\d+\.\d+)$') {
            $ver = $matches[1]
            Write-Host "Triggered by manual tag push: v$ver"
          } elseif ($manualVer -ne "") {
            $ver = $manualVer
            Write-Host "Triggered by workflow_dispatch with manual version: $ver"
          } else {
            if ($validVersions.Count -gt 0) {
              $latestVersion = $validVersions | Sort-Object -Descending | Select-Object -First 1
              $major = $latestVersion.Major
              $minor = $latestVersion.Minor
              $patch = $latestVersion.Build + 1
              $ver = "$major.$minor.$patch"
              Write-Host "Calculated next patch version: $ver (based on latest release tag v$($latestVersion.ToString(3)))"
            } else {
              $ver = "1.0.17"
              Write-Host "No previous release tags found. Defaulting to: $ver"
            }
          }
          
          # Verify the release tag does not already exist
          if ($validVersions.Count -gt 0 -and $validVersions -contains [version]$ver) {
            throw "FATAL: Release for tag 'v$ver' already exists! Releases cannot be overwritten."
          }
          
          $tag = "v$ver"
          $installerName = "TallyAuditAssistant-Setup-$ver.exe"
          
          Write-Host "=========================================="
          Write-Host "AUTOMATED VERSION:     $ver"
          Write-Host "TARGET RELEASE TAG:    $tag"
          Write-Host "TARGET INSTALLER EXE:  $installerName"
          Write-Host "=========================================="
          
          "VERSION=$ver" >> $env:GITHUB_OUTPUT
          "RELEASE_TAG=$tag" >> $env:GITHUB_OUTPUT
          "INSTALLER_NAME=$installerName" >> $env:GITHUB_OUTPUT

      - name: Update Version in Source Files
        shell: pwsh
        run: |
          $ver = "${{ steps.versioning.outputs.VERSION }}"
          
          # 1. Update AppVersion.cs
          $appVersionPath = "windows-desktop/src/TallyAuditAssistant.Core/Common/AppVersion.cs"
          $content = Get-Content $appVersionPath -Raw
          $content = $content -replace 'public const string Version\s*=\s*"[^"]+";', "public const string Version = `"$ver`";"
          Set-Content $appVersionPath -Value $content -NoNewline
          Write-Host "Updated version to $ver in $appVersionPath"
          
          # 2. Update TallyAuditAssistant.App.csproj
          $csprojPath = "windows-desktop/src/TallyAuditAssistant.App/TallyAuditAssistant.App.csproj"
          $content = Get-Content $csprojPath -Raw
          $content = $content -replace '<Version>[^<]+</Version>', "<Version>$ver</Version>"
          $content = $content -replace '<AssemblyVersion>[^<]+</AssemblyVersion>', "<AssemblyVersion>$ver.0</AssemblyVersion>"
          $content = $content -replace '<FileVersion>[^<]+</FileVersion>', "<FileVersion>$ver.0</FileVersion>"
          Set-Content $csprojPath -Value $content -NoNewline
          Write-Host "Updated version to $ver inside $csprojPath"
          
          # 3. Update TallyAuditAssistant.iss
          $issPath = "windows-desktop/installer/TallyAuditAssistant.iss"
          $content = Get-Content $issPath -Raw
          $content = $content -replace '#define MyAppVersion\s+"[^"]+"', "#define MyAppVersion `"$ver`""
          Set-Content $issPath -Value $content -NoNewline
          Write-Host "Updated version to $ver inside $issPath"

      - name: Commit & Push Version Synchronization
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          $appVersionPath = "windows-desktop/src/TallyAuditAssistant.Core/Common/AppVersion.cs"
          $csprojPath = "windows-desktop/src/TallyAuditAssistant.App/TallyAuditAssistant.App.csproj"
          $issPath = "windows-desktop/installer/TallyAuditAssistant.iss"
          
          git add $appVersionPath $csprojPath $issPath
          
          # Check if there are changes to commit
          $status = git status --porcelain
          if ($status) {
            git commit -m "chore: bump application version to ${{ steps.versioning.outputs.VERSION }} [skip ci]"
            git push origin HEAD:main
            Write-Host "Successfully pushed version bump commit to main."
          } else {
            Write-Host "No files changed, skipping version bump commit."
          }

      - name: Verify Inno Setup Script Version Alignment
        shell: pwsh
        run: |
          $issPath = "windows-desktop/installer/TallyAuditAssistant.iss"
          $expectedVer = "${{ steps.versioning.outputs.VERSION }}"
          $issContent = Get-Content $issPath -Raw
          if ($issContent -notmatch "#define MyAppVersion\s+`"$expectedVer`"") {
            throw "Inno Setup script $issPath MyAppVersion does not match authoritative version $expectedVer!"
          }
          Write-Host "Inno Setup version definition verified: $expectedVer"

      - name: Restore dependencies
        run: dotnet restore windows-desktop/TallyAuditAssistant.sln

      - name: Build solution (Release)
        run: dotnet build windows-desktop/TallyAuditAssistant.sln -c Release --no-restore

      - name: Run automated test suite
        run: dotnet test windows-desktop/tests/TallyAuditAssistant.Tests/TallyAuditAssistant.Tests.csproj -c Release --no-build --verbosity normal

      - name: Publish self-contained Windows x64 binary
        run: >
          dotnet publish
          windows-desktop/src/TallyAuditAssistant.App/TallyAuditAssistant.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o ./publish

      - name: Verify published executable
        shell: pwsh
        run: |
          if (-not (Test-Path "./publish/TallyAuditAssistant.App.exe")) {
            throw "Executable TallyAuditAssistant.App.exe was not generated in publish directory!"
          }
          $exe = Get-Item "./publish/TallyAuditAssistant.App.exe"
          Write-Host "Executable validated: $($exe.FullName) ($([math]::Round($exe.Length / 1MB, 2)) MB)"

      - name: Compile Inno Setup Windows Installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: windows-desktop/installer/TallyAuditAssistant.iss

      - name: Verify Windows Installer
        shell: pwsh
        run: |
          $expectedInstaller = "./windows-desktop/installer_output/${{ steps.versioning.outputs.INSTALLER_NAME }}"
          if (-not (Test-Path $expectedInstaller)) {
            throw "Expected installer '$expectedInstaller' was not generated in ./windows-desktop/installer_output/! Verify Inno Setup OutputBaseFilename configuration."
          }
          $installer = Get-Item $expectedInstaller
          Write-Host "Installer validated: $($installer.FullName)"
          Write-Host "Installer size: $([math]::Round($installer.Length / 1MB, 2)) MB"

      - name: Upload Windows Standalone Binaries
        uses: actions/upload-artifact@v4
        with:
          name: TallyAuditAssistant-Windows-x64-${{ steps.versioning.outputs.VERSION }}
          path: ./publish/
          if-no-files-found: error

      - name: Upload Windows Installer Setup
        uses: actions/upload-artifact@v4
        with:
          name: TallyAuditAssistant-Installer-Setup-${{ steps.versioning.outputs.VERSION }}
          path: ./windows-desktop/installer_output/${{ steps.versioning.outputs.INSTALLER_NAME }}
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.RELEASE_TAG }}
          name: Tally Audit Assistant ${{ steps.versioning.outputs.RELEASE_TAG }}
          draft: false
          prerelease: false
          make_latest: true
          target_commitish: main
          files: |
            ./windows-desktop/installer_output/${{ steps.versioning.outputs.INSTALLER_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
